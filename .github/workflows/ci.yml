name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # A real PostgreSQL so the live-connection and comparison tests actually run.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: pharmacy
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Load the sample schema into PostgreSQL
        run: psql "postgresql://postgres:ci-password@localhost:5432/pharmacy" -f samples/pharmacy.sql

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
        env:
          SCHEMAFLOW_TEST_PG: localhost:5432:pharmacy:postgres:ci-password